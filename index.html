<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drive Uploader</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <div class="glass-card">
    <div class="header-row">
      <h1 class="title">Google Drive Upload</h1>
      <button type="button" class="corner-btn" onclick="openGalleryPasswordModal()" title="Uploaded Photos">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>Photos</span>
      </button>
    </div>
    <p class="sub">Ek saath kai photos ya files chunein — upload se pehle password poochha jayega.</p>

    <label for="drivePhotoInput" class="btn">
      <span id="photoLabelText">Direct Photos (Multiple)</span>
    </label>
    <input type="file" id="drivePhotoInput" accept="image/*" multiple>

    <label for="driveFileInput" class="upload-box">
      <span id="fileLabelText">Choose Files (Multiple Any File)</span>
    </label>
    <input type="file" id="driveFileInput" multiple>

    <button type="button" class="btn" id="uploadTriggerBtn" onclick="openUploadPasswordModal()">Upload to Drive</button>

    <div class="status-box" id="statusBox">
      <div class="status" id="statusText">Ready</div>
      <div class="timer-line" id="timerLine"></div>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- Upload Password Modal -->
  <div class="modal-backdrop" id="uploadPassModal">
    <div class="modal-box">
      <div style="font-size:15px; font-weight:700;">Upload Password</div>
      <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">Upload shuru karne ke liye password dalein</div>
      <input type="password" class="pass-input" id="uploadPassInput" placeholder="Enter password..." onkeydown="if(event.key==='Enter') confirmUploadWithPassword()">
      <div class="row-2">
        <button type="button" class="btn" style="margin-bottom:0;" onclick="closeModal('uploadPassModal')">Cancel</button>
        <button type="button" class="btn" style="margin-bottom:0;" onclick="confirmUploadWithPassword()">Verify & Upload</button>
      </div>
    </div>
  </div>

  <!-- Gallery Password Modal -->
  <div class="modal-backdrop" id="galleryPassModal">
    <div class="modal-box">
      <div style="font-size:15px; font-weight:700;">Uploaded Photos Lock</div>
      <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">Uploaded photos dekhne ke liye password dalein</div>
      <input type="password" class="pass-input" id="galleryPassInput" placeholder="Enter password..." onkeydown="if(event.key==='Enter') confirmGalleryPassword()">
      <div id="galleryPassError" style="font-size:12px; color:#f87171; margin-bottom:8px; display:none;">Galat password!</div>
      <div class="row-2">
        <button type="button" class="btn" style="margin-bottom:0;" onclick="closeModal('galleryPassModal')">Cancel</button>
        <button type="button" class="btn" style="margin-bottom:0;" onclick="confirmGalleryPassword()">Open Photos</button>
      </div>
    </div>
  </div>

  <!-- Full-Screen Uploaded Photos Overlay -->
  <div class="fullscreen-gallery" id="fullscreenGallery">
    <div class="gallery-top-bar">
      <div>
        <div style="font-size:17px; font-weight:700;">Uploaded Photos</div>
        <div id="galleryCountText" style="font-size:12px; color:var(--text-secondary);">Loading...</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="corner-btn" onclick="loadUploadedPhotos()">Refresh</button>
        <button type="button" class="corner-btn" onclick="closeFullscreenGallery()">Close</button>
      </div>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
