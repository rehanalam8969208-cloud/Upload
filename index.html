<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drive Uploader</title>
  <style>
    :root {
      --bg-base: #06070a;
      --card-color: #ffffff;
      --card-alpha: 0.08;
      --glass-blur: 24px;
      --border-color: #ffffff;
      --border-alpha: 0.16;
      --radius: 26px;
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --btn-border: rgba(255, 255, 255, 0.24);
      --btn-active-bg: #ffffff;
      --btn-active-text: #06070a;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(255, 255, 255, 0.06) 0%, transparent 45%),
        var(--bg-base);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .glass-card {
      width: 100%;
      max-width: 420px;
      padding: 22px;
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--card-color) calc(var(--card-alpha) * 100%), transparent);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid color-mix(in srgb, var(--border-color) calc(var(--border-alpha) * 100%), transparent);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px 0;
    }

    .sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin: 0 0 18px 0;
    }

    input[type="file"] {
      display: none;
    }

    .upload-box, .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--btn-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }

    .upload-box {
      border-style: dashed;
      margin-bottom: 10px;
      text-align: center;
    }

    .btn {
      margin-bottom: 10px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn:active:not(:disabled), .upload-box:active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      transform: scale(0.97);
    }

    .status-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
    }

    .status-box.uploading {
      background: rgba(56, 189, 248, 0.14);
      border-color: var(--accent);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.25);
    }

    .status {
      font-size: 12.5px;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.45;
    }

    .timer-line {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #7dd3fc;
      text-align: center;
      display: none;
    }

    .progress-track {
      margin-top: 8px;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      display: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(18px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 340px;
      padding: 20px;
      border-radius: 22px;
      background: rgba(14, 16, 23, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    .pass-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.4);
      color: #ffffff;
      font-size: 14px;
      margin: 12px 0;
      outline: none;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <h1 class="title">Google Drive Upload</h1>
    <p class="sub">एक साथ कई फ़ोटो या फ़ाइलें चुनें — अपलोड से पहले पासवर्ड पूछा जाएगा।</p>

    <label for="drivePhotoInput" class="btn">
      <span id="photoLabelText">Direct Photos (Multiple)</span>
    </label>
    <input type="file" id="drivePhotoInput" accept="image/*" multiple>

    <label for="driveFileInput" class="upload-box">
      <span id="fileLabelText">Choose Files (Multiple Any File)</span>
    </label>
    <input type="file" id="driveFileInput" multiple>

    <button type="button" class="btn" id="uploadTriggerBtn" onclick="openPasswordModal()">Upload to Drive</button>

    <div class="status-box" id="statusBox">
      <div class="status" id="statusText">Ready</div>
      <div class="timer-line" id="timerLine"></div>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="passModal">
    <div class="modal-box">
      <div style="font-size:15px; font-weight:700;">Password Required</div>
      <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">अपलोड शुरू करने के लिए पासवर्ड डालें</div>
      <input type="password" class="pass-input" id="passInput" placeholder="Enter password..." onkeydown="if(event.key==='Enter') confirmUploadWithPassword()">
      <div class="row-2">
        <button type="button" class="btn" style="margin-bottom:0;" onclick="closePasswordModal()">Cancel</button>
        <button type="button" class="btn" style="margin-bottom:0;" onclick="confirmUploadWithPassword()">Verify & Upload</button>
      </div>
    </div>
  </div>

  <script>
    const DRIVE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzZR-2GrvNEKvJHVCC-wsYGRAwKNLeTx_JOGtfgn4FmHGZ0YfZL77lYZthVbCW9sPCT/exec";
    const REQUIRED_PASS = "zeeshan";

    let selectedFiles = [];
    let isUploading = false;
    let elapsedTimer = null;

    const photoInput = document.getElementById("drivePhotoInput");
    const fileInput = document.getElementById("driveFileInput");
    const photoLabelText = document.getElementById("photoLabelText");
    const fileLabelText = document.getElementById("fileLabelText");
    const statusBox = document.getElementById("statusBox");
    const statusText = document.getElementById("statusText");
    const timerLine = document.getElementById("timerLine");
    const progressTrack = document.getElementById("progressTrack");
    const progressFill = document.getElementById("progressFill");
    const uploadTriggerBtn = document.getElementById("uploadTriggerBtn");
    const passModal = document.getElementById("passModal");
    const passInput = document.getElementById("passInput");

    function formatTotalSize(files) {
      const totalBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
      if (totalBytes >= 1024 * 1024) {
        return `${(totalBytes / (1024 * 1024)).toFixed(1)} MB`;
      }
      return `${Math.max(1, Math.round(totalBytes / 1024))} KB`;
    }

    function estimateSeconds(files) {
      const totalBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
      const sizeBasedSec = Math.ceil(totalBytes / (300 * 1024));
      return Math.max(2, files.length + sizeBasedSec);
    }

    function handleFilesPicked(fileList, sourceType) {
      if (isUploading) return;
      const arr = Array.from(fileList || []);
      if (!arr.length) return;
      selectedFiles = arr;

      const summary = `${arr.length} ${sourceType === "photo" ? "photo(s)" : "file(s)"} • ${formatTotalSize(arr)}`;
      if (sourceType === "photo") {
        photoLabelText.textContent = summary;
        fileLabelText.textContent = "Choose Files (Multiple Any File)";
      } else {
        fileLabelText.textContent = summary;
        photoLabelText.textContent = "Direct Photos (Multiple)";
      }

      statusBox.classList.remove("uploading");
      timerLine.style.display = "none";
      progressTrack.style.display = "none";
      progressFill.style.width = "0%";
      statusText.textContent = `${summary} ready. Estimated time: ~${estimateSeconds(arr)}s`;
    }

    photoInput.addEventListener("change", (e) => {
      handleFilesPicked(e.target.files, "photo");
      e.target.value = "";
    });

    fileInput.addEventListener("change", (e) => {
      handleFilesPicked(e.target.files, "file");
      e.target.value = "";
    });

    function openPasswordModal() {
      if (isUploading) return;
      if (!selectedFiles.length) {
        statusText.textContent = "पहले Direct Photos या Choose Files से फ़ाइलें चुनें।";
        return;
      }
      passInput.value = "";
      passModal.classList.add("open");
      setTimeout(() => passInput.focus(), 80);
    }

    function closePasswordModal() {
      passModal.classList.remove("open");
    }

    function confirmUploadWithPassword() {
      const entered = passInput.value.trim().toLowerCase();
      if (entered !== REQUIRED_PASS) {
        statusBox.classList.remove("uploading");
        statusText.textContent = "गलत पासवर्ड! अपलोड रोक दिया गया।";
        closePasswordModal();
        return;
      }
      closePasswordModal();
      uploadSelectedFiles();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          resolve(String(reader.result || "").split(",")[1] || "");
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadSelectedFiles() {
      if (!selectedFiles.length || isUploading) return;

      isUploading = true;
      uploadTriggerBtn.disabled = true;
      statusBox.classList.add("uploading");
      timerLine.style.display = "block";
      progressTrack.style.display = "block";
      progressFill.style.width = "8%";

      const estSec = estimateSeconds(selectedFiles);
      let secPassed = 0;
      timerLine.textContent = `⏱ 0s / ~${estSec}s`;

      clearInterval(elapsedTimer);
      elapsedTimer = setInterval(() => {
        secPassed++;
        const displayEst = Math.max(estSec, secPassed + 1);
        timerLine.textContent = `⏱ ${secPassed}s / ~${displayEst}s`;
      }, 1000);

      let uploadedCount = 0;
      for (let i = 0; i < selectedFiles.length; i++) {
        const f = selectedFiles[i];
        statusText.textContent = `Uploading ${i + 1} of ${selectedFiles.length}: ${f.name}`;
        progressFill.style.width = `${Math.max(10, Math.round((i / selectedFiles.length) * 100))}%`;

        try {
          const base64Data = await fileToBase64(f);
          await fetch(DRIVE_WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              filename: f.name,
              mimeType: f.type || "application/octet-stream",
              base64: base64Data
            })
          });
          uploadedCount++;
          progressFill.style.width = `${Math.round(((i + 1) / selectedFiles.length) * 100)}%`;
        } catch (err) {
          statusText.textContent = `Error on ${f.name} (${i + 1}/${selectedFiles.length})`;
        }
      }

      clearInterval(elapsedTimer);
      isUploading = false;
      uploadTriggerBtn.disabled = false;
      progressFill.style.width = "100%";
      timerLine.textContent = `✔ Completed in ${secPassed}s`;
      statusText.textContent = `${uploadedCount}/${selectedFiles.length} file(s) sent to Google Drive.`;
      selectedFiles = [];
      photoLabelText.textContent = "Direct Photos (Multiple)";
      fileLabelText.textContent = "Choose Files (Multiple Any File)";
    }
  </script>
</body>
</html>
